name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (needed to build faser._core)
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      # No extras: the `full` extra pins pyqt5-qt5, which ships no Windows
      # wheel, and the tests only exercise the simulator, not the GUI.
      - name: Install the project (compiles the native backend)
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest src/tests
