name: Release with uv and semantic-release

on:
  push:
    branches: [main, next, "*.x"] # main: stable, next: prereleases, N.x: maintenance

# contents: semantic-release pushes the version-bump commit + tag and creates
# the GitHub Release. id-token: PyPI trusted publishing via `uv publish`.
permissions:
  contents: write
  id-token: write

jobs:
  # Run the suite, then let python-semantic-release decide the next version from
  # the conventional-commit history, bump pyproject.toml, tag, and cut a GitHub
  # Release with generated notes. The sdist is built here; wheels need a Rust
  # toolchain per platform and are built by the matrix job below.
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history + tags

      - name: Install Rust toolchain (needed to build faser._core)
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest src/tests

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The bump commit is pushed with GITHUB_TOKEN, which does not
          # re-trigger this workflow.
          changelog: false

      - name: Upload sdist
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # One abi3 wheel per platform, built from the tagged commit.
  wheels:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter python3.12
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # rc versions upload fine; pip ignores them unless `--pre` is passed.
  publish:
    needs: [release, wheels]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Publish to PyPI
        run: uv publish dist/*
