[project]
name = "faser"
version = "0.4.0"
description = "Faser is a tool for vectorial psf simulation"
authors = [
    { name = "Johannes Roos", email = "jhnnsrs@gmail.com" },
    { name = "Stephane Bancelin", email = "stephane.bancelin@cnrs.fr" }
]
maintainers = [
    { name = "Johannes Roos", email = "jhnnsrs@gmail.com" }
]
dependencies = [
    "numpy<2",
    "pydantic>2",
    "matplotlib>=3.9.2",
    "python-slugify>=8.0.4",
    "tifffile>=2024.8.30",
    "psygnal>=0.11.1",
    "qtpy>=2.4.2",
    "superqt>=0.6.7",
    "rich-click>=1.8.5",
]
classifiers = [
    "Framework :: napari",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"
requires-python = ">=3.9, <3.13"
license =  { file = "LICENSE", name = "MIT" }
keywords = ["napari", "psf", "simulation", "faser", "vectorial"]



[project.urls]
"Bug Tracker" = "https://jhnnsrs.github.io/faser/issues"
"Documentation" = "https://jhnnsrs.github.io/faser"
"Source Code" = "https://github.com/jhnnsrs/faser"

[project.optional-dependencies]
full = [
    "pyqt5>=5.15.11",
    "rich-click>=1.8.3",
]
cli = [
    "rich-click>=1.8.3",
]
numba = [
    "numba>=0.60.0",
]

[project.scripts]
faser = 'faser.cli.main:main'
qtfaser = 'faser.cli.qtmain:main'

[project.entry-points."napari.manifest"]
faser = 'faser:napari.yaml'

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed Rust/Python project: the crate in ./rust is compiled to faser._core,
# the Python package lives in ./src/faser.
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "faser._core"
features = ["pyo3/extension-module"]
include = [{ path = "src/faser/napari.yaml", format = ["sdist", "wheel"] }]

[tool.semantic_release]
# Same flow as jhnnsrs/mikro (PSR GitHub Action, conventional commits, GitHub
# Release + `uv publish`), except that the version is bumped in pyproject.toml
# and committed: maturin reads the version from this file, not from git tags,
# and the per-platform wheel jobs check out the release tag to build.
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
# The PSR action runs in a container without cargo, so only the sdist is built
# here (it needs no compiler). Wheels come from the matrix job in publish.yml.
build_command = """
    python -m pip install 'uv>=0.7.12'
    uv build --sdist
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

[tool.uv]
dev-dependencies = [
    "napari>=0.5.5",
    "pytest>=8.3.4",
    "python-semantic-release>=10.1.0",
]
